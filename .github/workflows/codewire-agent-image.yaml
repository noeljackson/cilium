# Builds the Cilium agent image Codewire's clusters run until upstream ships
# cilium/cilium#49091 (restored endpoints lose label-selected policy,
# cilium/cilium#49019). The source is the single backport commit on
# v1.20.4; the image is upstream's own images/cilium/Dockerfile release
# target with its pinned builder, runtime and envoy bases, unchanged.
name: Codewire cilium-agent image

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'noeljackson/cilium'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: 6ecc4823972662dc409953d8ea8a5c7f316136d3
      UPSTREAM_VERSION: 1.20.4
      IMAGE: ghcr.io/noeljackson/cilium
      TAG: v1.20.4-cw49091-6ecc4823
    steps:
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out the exact backport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6ecc4823972662dc409953d8ea8a5c7f316136d3
          persist-credentials: false

      - name: Verify the source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "$UPSTREAM_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the agent image (linux/amd64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/cilium/Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/noeljackson/cilium
            org.opencontainers.image.revision=6ecc4823972662dc409953d8ea8a5c7f316136d3
            org.opencontainers.image.version=v1.20.4-cw49091
            org.opencontainers.image.description=Cilium agent v1.20.4 with cilium/cilium#49091 backported
            org.opencontainers.image.licenses=Apache-2.0
            sh.codewire.upstream-pr=https://github.com/cilium/cilium/pull/49091
            sh.codewire.upstream-issue=https://github.com/cilium/cilium/issues/49019

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${IMAGE}@${DIGEST}"
          echo "Pushed \`${IMAGE}:${TAG}@${DIGEST}\` from \`${SOURCE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
